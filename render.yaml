services:
  - type: web
    name: face-attendance
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: MONGO_URI
        sync: false
      - key: PYTHON_EXECUTABLE
        value: python3
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FACE_DATA_DIR
        value: /opt/render/project/src/github-face-data
